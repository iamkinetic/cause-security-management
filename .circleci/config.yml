# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  build_and_test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:9.0

    steps:
      - checkout

      - run:
          name: Restore dependencies
          command: dotnet restore

      - run:
          name: Build
          command: dotnet build --configuration Release --no-restore

      - run:
          name: Run Unit Tests
          command: dotnet test --configuration Release --no-build --verbosity normal

      - run:
          name: Lint (format check)
          command: dotnet format --verify-no-changes


workflows:
  version: 2
  build_and_test:
    jobs:
      - build_and_test